<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ORYX Modding Studios</title>
    <link rel="stylesheet" href="css/style.css">

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #0b0b0b;
            color: white;
            text-align: center;
        }

        header {
            padding: 80px 20px;
        }

        h1 {
            font-size: 60px;
            letter-spacing: 8px;
            margin: 0;
        }

        h2 {
            font-weight: normal;
            color: #aaaaaa;
        }

        p {
            font-size: 20px;
            color: #cccccc;
        }

        .buttons {
            margin-top: 40px;
        }

        .button {
            display: inline-block;
            margin: 10px;
            padding: 15px 35px;
            background: #00a86b;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
        }

        .button:hover {
            background: #00c982;
        }

        footer {
            margin-top: 100px;
            padding: 20px;
            color: #777;
        }
    </style>

</head>

<body>

<header>

    <img src="images/logo.png" width="250">

    <h2>Modding Studios</h2>

    <p>
        Independent MotoGP Modding Studio
    </p>

    <p>
        Paint Kits • Custom Liveries • Tutorials
    </p>


    <div class="buttons">

        <a class="button" href="#">
            Downloads
        </a>

        <a class="button" href="#">
            Paint Kits
        </a>

    </div>


</header>


<footer>

    © 2026 ORYX Modding Studios 🇧🇷

</footer>


</body>
</html>
